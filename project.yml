name: Biomarkers
options:
  bundleIdPrefix: ca.thedailygain
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.0.0"
targets:
  Biomarkers:
    type: application
    platform: iOS
    sources:
      - Biomarkers
    dependencies:
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAuth
      - target: BiomarkersWidget
    entitlements:
      path: Biomarkers/Biomarkers.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.ca.thedailygain.biomarkers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.thedailygain.biomarkers
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Biomarkers
        SWIFT_VERSION: "5.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ADPUGXVDZQ
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

  BiomarkersWidget:
    type: app-extension
    platform: iOS
    sources:
      - BiomarkersWidget
      - Biomarkers/Widget/WidgetSnapshot.swift
    entitlements:
      path: BiomarkersWidget/BiomarkersWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ca.thedailygain.biomarkers
    info:
      path: BiomarkersWidget/Info.plist
      properties:
        CFBundleDisplayName: Biomarkers
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.thedailygain.biomarkers.widget
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ADPUGXVDZQ
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
